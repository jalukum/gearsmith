name: Refresh patch notes

on:
  schedule:
    # Daily, 13:17 UTC. For Honor patches are occasional; once a day is enough
    # and stays clear of the top of the hour, when scheduled workflows slip.
    - cron: '17 13 * * *'
  workflow_dispatch:

# This job pushes to main and deploys Pages. A push made with GITHUB_TOKEN does
# not start the other deploy workflow, so the deploy below is what publishes
# new notes. The repo must allow Actions to write (Settings → Actions → General
# → Workflow permissions → Read and write). No extra secret is required.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-patches.mjs
      - run: npm test
      - id: diff
        run: |
          if git diff --quiet -- src/data/patches.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: npm run build
      - name: Commit when notes changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/patches.json
          title=$(node --input-type=module -e "import {readFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('src/data/patches.json','utf8')); console.log(p.patches[0]?.title ?? 'patch notes')")
          git commit -m "Update For Honor patch notes" -m "$title"
          git push
      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
